# ==================================================
# LAB SAMPLE MCP SERVER
# ==================================================

spring.application.name=lab-sample-management-mcp-server

# Run the MCP server on port 8082.
server.port=8082

# Bind to localhost during development.
# This prevents other machines from directly connecting
# to the MCP server.
server.address=127.0.0.1


# ==================================================
# MCP SERVER CONFIGURATION
# ==================================================

spring.ai.mcp.server.name=lab-sample-management
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.capabilities.tool=true

spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.completion=false


# ==================================================
# EXISTING BACKEND URLS
# ==================================================

# The backend where normal users manage their own samples.
lab.backend.user.url=http://localhost:8080

# The backend where administrators manage all samples.
lab.backend.admin.url=http://localhost:8081


# ==================================================
# HTTP CLIENT CONFIGURATION
# ==================================================

# Maximum time to wait for a backend to respond.
lab.backend.connect-timeout-seconds=5

# Maximum time allowed for an individual backend request.
lab.backend.read-timeout-seconds=15
